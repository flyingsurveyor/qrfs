[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrfs"
version = "0.1.0"
description = "Physical, offline, encrypted data transport and storage via printable QR codes"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "FlyingSurveyor" }]
keywords = [
    "qr-code",
    "encryption",
    "air-gapped",
    "archival",
    "optical",
    "offline",
    "cryptography",
    "fec",
    "reed-solomon",
]

dependencies = [
    "Flask>=3.0.0",
    "qrcode[pil]>=7.4.2",
    "reportlab>=4.0.0",
    "cryptography>=42.0.0",
    "pyzbar>=0.1.9",
    "Pillow>=10.0.0",
    "PyNaCl>=1.5.0",
    "reedsolo>=1.7.0",
    "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "bandit[toml]>=1.7",
]

[project.scripts]
qrfs = "qrfs.__main__:main"

[project.urls]
Homepage = "https://github.com/flyingsurveyor/qrfs"

[tool.setuptools.packages.find]
where = ["."]
include = ["qrfs*"]

[tool.setuptools.package-data]
qrfs = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# === Pre-1.0 lint debt ===
# All files below were written before ruff was wired into CI. The first
# successful lint job (after fixing pip backend issues) surfaced ~200
# style violations across the existing codebase: long lines, redundant
# `open(..., 'r', ...)` modes, unsorted imports, unused locals, missing
# `raise from`, mutable default args, etc.
#
# Per the PR #1 policy ("configure tools, do not auto-format the codebase
# in this PR"), these are tracked as tech debt rather than bulk-rewritten.
# A dedicated lint-cleanup PR (planned together with the format-cleanup
# PR) will remove these per-file-ignores by fixing the underlying code.
"qrfs.py" = ["E501", "UP015", "I001", "F401", "B007", "B904", "B008"]
"qrfs/**/*.py" = ["E501", "UP015", "I001", "F401", "B007", "B904", "B008"]
"tests/**/*.py" = ["E501", "UP015", "I001", "F401", "B007", "B904", "B008", "E402"]
"tools/**/*.py" = ["E501", "UP015", "I001", "F401", "B007", "B904", "B008", "E401", "E701", "E722", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests that are slow (mainly Argon2id key derivation); deselect with -m 'not slow'",
]

[tool.bandit]
skips = ["B110", "B112", "B311", "B404", "B603", "B607"]
